spring.application.name=DoAnJava

# 1. Cấu hình kết nối Database SQL Server
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=Ten_Database_Cua_Ban;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=Mat_Khau_Cua_Ban
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# 2. Cấu hình Hibernate/JPA (Tự động tạo hoặc cập nhật bảng trong SQL Server)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect