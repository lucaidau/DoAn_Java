spring.application.name=DoAnJava

# 1. Cấu hình kết nối Database SQL Server
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=HeThongDatLichKhamBenh;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=123456
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# 2. Cấu hình Hibernate/JPA (Tự động tạo hoặc cập nhật bảng trong SQL Server)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect


# Tắt cache giao diện
spring.thymeleaf.cache=false

# Đọc template trực tiếp từ thư mục source, không cần build lại
spring.thymeleaf.prefix=file:src/main/resources/templates/

# Tương tự cho CSS/JS/ảnh trong static
spring.web.resources.static-locations=file:src/main/resources/static/
spring.web.resources.cache.period=0