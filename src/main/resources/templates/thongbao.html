
<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CareHealth - Thông báo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<!-- -- Thanh điều hướng -- -->
<nav class="navbar navbar-expand-lg sticky-top mb-4 no-print">
    <div class="container-fluid px-4 d-flex flex-wrap gap-3">
        <a class="navbar-brand brand-mark" th:href="@{/lichhen}">
            ✚ CareHealth
        </a>
        <div class="d-flex flex-wrap gap-2">
            <a class="btn btn-outline-primary btn-sm" th:href="@{/lichhen}">
                Lịch hẹn
            </a>
            <a class="btn btn-outline-primary btn-sm" th:href="@{/lichhen/tao}">
                Tiếp nhận
            </a>
            <a class="btn btn-outline-primary btn-sm" th:href="@{/catruc}">
                Ca trực
            </a>
            <a class="btn btn-outline-primary btn-sm" th:href="@{/thongbao}">
                Thông báo
            </a>
        </div>
    </div>
</nav>

<!-- -- Nội dung trang thông báo -- -->
<div class="container-fluid px-4 pb-5">
    <!-- -- Thông báo kết quả thao tác -- -->
    <div
            th:if="${thanhCong}"
            class="alert alert-success"
            th:text="${thanhCong}">
    </div>
    <div
            th:if="${loi}"
            class="alert alert-danger"
            th:text="${loi}">
    </div>

    <h2 class="page-title mb-4">Thông báo lịch hẹn</h2>

    <!-- -- Danh sách thông báo lịch hẹn -- -->
    <div class="card">
        <div class="list-group list-group-flush">
            <a
                    class="list-group-item list-group-item-action py-3"
                    th:each="lich : ${lichHens}"
                    th:href="@{/lichhen/{id}(id=${lich.id})}">

                <strong
                        th:text="${'LH-' + lich.id + ' - ' + lich.benhNhan.hoTen}">
                </strong>

                <span
                        class="badge text-bg-light ms-2"
                        th:text="${lich.trangThai}">
                    </span>

                <div
                        class="text-secondary small"
                        th:text="${lich.ngayTao}">
                </div>
            </a>

            <!-- -- Hiển thị khi chưa có lịch hẹn -- -->
            <div
                    th:if="${#lists.isEmpty(lichHens)}"
                    class="p-4">
                Chưa có lịch hẹn
            </div>
        </div>
    </div>
</div>
</body>
</html>
