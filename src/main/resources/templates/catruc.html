
<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CareHealth - Ca trực</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<!-- -- Thanh điều hướng -- -->
<nav class="navbar navbar-expand-lg sticky-top mb-4 no-print">
    <div class="container-fluid px-4 d-flex flex-wrap gap-3">
        <a class="navbar-brand brand-mark" th:href="@{/lichhen}">
            ✚ CareHealth
        </a>
        <div class="d-flex flex-wrap gap-2">
            <a class="btn btn-outline-primary btn-sm" th:href="@{/lichhen}">
                Lịch hẹn
            </a>
            <a class="btn btn-outline-primary btn-sm" th:href="@{/lichhen/tao}">
                Tiếp nhận
            </a>
            <a class="btn btn-outline-primary btn-sm" th:href="@{/catruc}">
                Ca trực
            </a>
            <a class="btn btn-outline-primary btn-sm" th:href="@{/thongbao}">
                Thông báo
            </a>
        </div>
    </div>
</nav>

<!-- -- Nội dung trang ca trực -- -->
<div class="container-fluid px-4 pb-5">
    <!-- -- Thông báo kết quả thao tác -- -->
    <div
            th:if="${thanhCong}"
            class="alert alert-success"
            th:text="${thanhCong}">
    </div>
    <div
            th:if="${loi}"
            class="alert alert-danger"
            th:text="${loi}">
    </div>

    <!-- -- Danh sách lịch làm việc bác sĩ -- -->
    <h2 class="page-title mb-4">Lịch làm việc bác sĩ</h2>

    <div class="card">
        <div class="table-responsive">
            <table class="table table-hover mb-0">
                <thead>
                <tr>
                    <th>Bác sĩ</th>
                    <th>Ngày</th>
                    <th>Ca</th>
                    <th>Bắt đầu</th>
                    <th>Kết thúc</th>
                    <th>Số lượng tối đa</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="ca : ${caKhams}">
                    <td th:text="${ca.bacSi.hoTen}"></td>
                    <td th:text="${ca.ngayLamViec}"></td>
                    <td th:text="${ca.tenCa}"></td>
                    <td th:text="${ca.gioBatDau}"></td>
                    <td th:text="${ca.gioKetThuc}"></td>
                    <td th:text="${ca.soLuongToida}"></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
