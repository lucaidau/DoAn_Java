<html lang="vi" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(content)">

    <title>Quản Trị Hệ Thống - CareHealth</title>

    <!-- Google Fonts & Material Symbols -->

        }
        ::-webkit-scrollbar {
            display: none;
        }

<body class="bg-surface font-body-md text-on-surface">

<!-- Sidebar Navigation -->
<aside class="fixed left-0 top-0 h-full w-72 bg-surface-container-lowest shadow-[0_1px_8px_rgba(0,0,0,0.04)] z-50 flex flex-col justify-between">
    <div class="flex flex-col">
        <!-- Brand Header -->
        <div class="p-space-lg flex items-center gap-space-sm bg-surface-container-lowest">
            <div class="w-10 h-10 rounded-xl bg-primary flex items-center justify-center text-on-primary shadow-sm">
                <span class="material-symbols-outlined text-[24px]">local_hospital</span>
            </div>
            <div class="flex flex-col">
                <span class="font-headline-sm text-headline-sm text-primary tracking-tight">CareHealth</span>
                <span class="font-label-sm text-label-sm text-on-surface-variant">Cổng Quản Trị Hệ Thống</span>
            </div>
        </div>

        <!-- Section Label -->
        <div class="px-space-md py-space-xs">
            <span class="px-space-sm font-label-sm text-label-sm text-outline uppercase tracking-wider">Quản trị hệ thống</span>
        </div>

        <!-- Menu Links -->
        <nav class="px-space-md py-space-xs flex flex-col gap-space-xs" data-active-classes="bg-primary-container text-on-primary-container font-label-md rounded-xl shadow-sm">
            <a class="flex items-center gap-space-sm px-space-md py-space-sm rounded-xl text-on-surface-variant font-body-md text-body-md hover:bg-surface-container hover:text-on-surface transition-all" data-path="dashboard" href="#">
                <span class="material-symbols-outlined text-[20px]">grid_view</span>
                <span>Dashboard &amp; Tài khoản</span>
            </a>
            <a aria-current="page" class="flex items-center gap-space-sm px-space-md py-space-sm transition-all bg-primary-container text-on-primary-container font-label-md rounded-xl shadow-sm" data-path="appointments" href="#">
                <span class="material-symbols-outlined text-[20px]">calendar_month</span>
                <span>Quản lý Lịch hẹn</span>
            </a>
            <a class="flex items-center gap-space-sm px-space-md py-space-sm rounded-xl text-on-surface-variant font-body-md text-body-md hover:bg-surface-container hover:text-on-surface transition-all" data-path="doctors" href="#">
                <span class="material-symbols-outlined text-[20px]">stethoscope</span>
                <span>Quản lý Bác sĩ</span>
            </a>
            <a class="flex items-center gap-space-sm px-space-md py-space-sm rounded-xl text-on-surface-variant font-body-md text-body-md hover:bg-surface-container hover:text-on-surface transition-all" data-path="specialties" href="#">
                <span class="material-symbols-outlined text-[20px]">medical_services</span>
                <span>Quản lý Chuyên khoa</span>
            </a>
            <a class="flex items-center gap-space-sm px-space-md py-space-sm rounded-xl text-on-surface-variant font-body-md text-body-md hover:bg-surface-container hover:text-on-surface transition-all" data-path="reports" href="#">
                <span class="material-symbols-outlined text-[20px]">bar_chart</span>
                <span>Báo cáo &amp; Thống kê</span>
            </a>
            <a class="flex items-center gap-space-sm px-space-md py-space-sm rounded-xl text-on-surface-variant font-body-md text-body-md hover:bg-surface-container hover:text-on-surface transition-all" data-path="settings" href="#">
                <span class="material-symbols-outlined text-[20px]">settings</span>
                <span>Cài đặt Hệ thống</span>
            </a>
        </nav>
    </div>

    <!-- User Profile & Logout Footer -->
    <div class="p-space-md m-space-md rounded-xl bg-surface-container-low flex flex-col gap-space-sm">
        <div class="flex items-center gap-space-sm">
            <div class="relative">
                <div class="w-10 h-10 rounded-full bg-primary flex items-center justify-center">
                    <span class="material-symbols-outlined text-on-primary text-[20px]">person</span>
                </div>
                <span class="absolute bottom-0 right-0 w-2.5 h-2.5 bg-status-confirmed rounded-full ring-2 ring-surface-container-lowest"></span>
            </div>
            <div class="flex flex-col min-w-0 flex-1">
                <span class="font-label-md text-label-md text-on-surface truncate">Nguyễn Trọng Trí</span>
                <span class="font-label-sm text-label-sm text-primary font-semibold">Super Admin</span>
            </div>
        </div>
        <button class="w-full flex items-center justify-center gap-space-xs py-space-xs px-space-sm rounded-lg bg-surface-container text-on-surface-variant hover:bg-error-container hover:text-on-error-container transition-colors font-label-sm text-label-sm">
            <span class="material-symbols-outlined text-[16px]">logout</span>
            <span>Đăng xuất</span>
        </button>
    </div>
</aside>

<!-- Main Layout Wrapper -->
<div class="pl-72">
    <!-- Top Header -->
    <header class="fixed top-0 left-72 right-0 h-16 bg-surface-container-lowest/90 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.04)] z-40 flex items-center justify-between px-space-lg">

        <div class="flex items-center w-full max-w-lg">

            </button>

            <div class="relative flex items-center">

                <span class="absolute -bottom-0.5 -right-0.5 w-2.5 h-2.5 bg-status-confirmed rounded-full ring-2 ring-surface-container-lowest"></span>
            </div>
        </div>
    </header>
